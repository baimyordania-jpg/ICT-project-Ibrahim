<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML form</title>
</head>
<body>
    <h2>Create form in the html</h2>
    <form action="">
        <h2>Student registration form</h2>
        <label>Fullname</label>
        <input type="text" name="name" placeholder="enter your fullname" required><br>
        <label>Email</label>
        <input type="text" name="email" placeholder="enter your email" required><br>
        <label>Password</label><br>
        <input type="password" name="password" placeholder="enter your password" required><br>
        <label>Date of birth</label><br>
        <input type="date" name="birthday" required><br>

        <label>Class</label><br>
        <select name="" id="">
            <option>Honest</option>
            <option>Brave</option>
            <option>Funny</option>
        </select><br>

        <label>Gender</label>
        <input type="radio" name="gender">male
        <input type="radio" name="gender">female <br>

        <label>Skills</label>
        <input type="checkbox">Drawing
        <input type="checkbox">Writing
        <input type="checkbox">Reading <br>

        <label>About yourself</label><br>
        <textarea rows="3" cols="30" placeholder="write about yourself here..." required></textarea><br>
        
        <button type="submit">submit</button>
        <button type="reset">reset</button>
    </form>
</body>
</html>
